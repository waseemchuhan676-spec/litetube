# Builds the LiteTube release APK in the cloud and publishes a GitHub Release.
# No Android SDK is ever needed on a developer machine: the Ubuntu runner
# installs JDK 17 and Gradle does the rest. This workflow costs nothing on
# the GitHub free tier for public repos (and 2,000 Actions minutes/month
# for private ones). Release files must each stay under 2 GB — an APK is
# a few MB, so this is never a constraint in practice.
#
# HOW IT RUNS
#   1. Bump versionName AND versionCode in app/build.gradle.kts.
#   2. Push a tag:  git tag v1.0.1 && git push origin v1.0.1
#      (or run it manually from the Actions tab with a tag input).
#   3. Actions verifies the tag matches the app's versionName, restores the
#      release keystore from secrets, builds ./gradlew assembleRelease and
#      PUBLISHES a release with app-release.apk plus its SHA-256 in the
#      notes. Publishing immediately (draft: false) is deliberate: a draft
#      release serves no asset URL, and a forgotten unpublished draft was
#      the easiest way to silently break updates. To restore
#      review-before-publish, flip draft back to true and publish by hand.
#   4. Copy the asset URL + SHA-256 into web-updater/public/update.json
#      (or enable the monorepo auto-update step at the bottom) and deploy
#      the web hub. The app picks the update up from the manifest.
#
# REPO LAYOUT NOTE
#   This file assumes the Android project is at the REPO ROOT (as LiteTube
#   is). If your Android project lives in android-app/ instead, add
#   `working-directory: android-app` to the "Build release APK" step and
#   adjust the APK path in the copy step to
#   android-app/app/build/outputs/apk/release/app-release.apk.
#
# SIGNING (required — the build fails without it, on purpose)
#   The app's build.gradle.kts reads signing from environment variables, so
#   no key material ever lands in git. Create the keystore once
#   (keytool -genkey -v -keystore release.keystore -alias litetube -keyalg
#   RSA -keysize 2048 -validity 10000), base64-encode it, and add four
#   GitHub secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS,
#   KEY_PASSWORD. Keep that keystore forever: Android refuses to update an
#   app signed with a different key. Losing it means users must uninstall
#   and reinstall.

name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Guard — tag must match the app versionName
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "Tag version: $TAG | app versionName: $NAME"
          if [ "$TAG" != "$NAME" ]; then
            echo "ERROR: tag v$TAG does not match app versionName $NAME."
            echo "Update versionName (and bump versionCode) before tagging."
            exit 1
          fi

      - name: Restore release keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Stage the APK
        run: cp app/build/outputs/apk/release/app-release.apk ./littletube.apk

      - name: Compute SHA-256
        id: sha
        run: |
          SHA=$(sha256sum ./littletube.apk | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"

      - name: Upload APK as workflow artifact (fallback if release publish fails)
        uses: actions/upload-artifact@v4
        with:
          name: littletube-apk
          path: ./littletube.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ./littletube.apk
          draft: false
          fail_on_unmatched_files: true
          body: |
            LiteTube release ${{ inputs.tag || github.ref_name }}

            SHA-256 of littletube.apk:
            ${{ steps.sha.outputs.sha }}

            Copy this SHA-256 into web-updater/public/update.json (with the
            asset URL above) and redeploy the web hub. The app picks the
            update up from the manifest.

      # OPTIONAL — MONOREPO ONLY (Option B). Uncomment this step if the
      # web-updater/ folder lives in the SAME repo as the Android app.
      # It writes the new versionCode, versionName, apkUrl and SHA-256 into
      # web-updater/public/update.json and commits it, so the manifest
      # update needs no manual copy step. Do NOT enable it for separate
      # repos (Option A): web-updater/ does not exist there and the step
      # would fail. It cannot loop: this workflow triggers on tags and
      # manual dispatch only, never on pushes to main.
      # - name: Update update.json (monorepo only)
      #   run: |
      #     python3 - <<'PYEOF'
      #     import json, re
      #     gradle = open("app/build.gradle.kts").read()
      #     code = int(re.search(r"versionCode\s*=\s*(\d+)", gradle).group(1))
      #     tag = "${{ inputs.tag || github.ref_name }}"
      #     repo = "${{ github.repository }}"
      #     path = "web-updater/public/update.json"
      #     data = json.load(open(path))
      #     data["versionCode"] = code
      #     data["versionName"] = tag.lstrip("v")
      #     data["apkUrl"] = f"https://github.com/{repo}/releases/download/{tag}/app-release.apk"
      #     data["sha256"] = "${{ steps.sha.outputs.sha }}"
      #     json.dump(data, open(path, "w"), indent=2)
      #     print("update.json updated for", tag)
      #     PYEOF
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add web-updater/public/update.json
      #     git commit -m "chore: update manifest for ${{ inputs.tag || github.ref_name }}"
      #     git push
